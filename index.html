<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        canvas {
            border: 2px solid #000;
            background-color: #fff;
        }
        .score-board {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .game-over {
            font-size: 2rem;
            color: red;
            font-weight: bold;
        }
        .start-btn {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="display-4">Snake Game</h1>
    <div class="score-board">
        <p id="score">Score: 0</p>
    </div>
    <canvas id="gameCanvas" width="300" height="300"></canvas>
    <div id="gameOver" class="game-over" style="display: none;">Game Over! Press F5 to Restart</div>
    <button id="startBtn" class="btn btn-primary start-btn">Start Game</button>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scale = 10;
    const rows = canvas.height / scale;
    const columns = canvas.width / scale;

    let score = 0;
    let snake;
    let fruit;
    let direction;
    let gameOver = false;
    let gameInterval;

    // Snake Constructor
    function Snake() {
        this.body = [{x: 10, y: 10}];
        this.length = 1;
        this.direction = "right";
        this.update = function() {
            const head = this.body[0];

            let newHead;
            if (this.direction === "right") {
                newHead = {x: head.x + 1, y: head.y};
            } else if (this.direction === "left") {
                newHead = {x: head.x - 1, y: head.y};
            } else if (this.direction === "up") {
                newHead = {x: head.x, y: head.y - 1};
            } else if (this.direction === "down") {
                newHead = {x: head.x, y: head.y + 1};
            }

            this.body.unshift(newHead);
            if (this.body.length > this.length) {
                this.body.pop();
            }
        };
        this.changeDirection = function(newDirection) {
            if (newDirection === "right" && this.direction !== "left") {
                this.direction = newDirection;
            } else if (newDirection === "left" && this.direction !== "right") {
                this.direction = newDirection;
            } else if (newDirection === "up" && this.direction !== "down") {
                this.direction = newDirection;
            } else if (newDirection === "down" && this.direction !== "up") {
                this.direction = newDirection;
            }
        };
        this.collidesWithWall = function() {
            const head = this.body[0];
            return head.x < 0 || head.x >= columns || head.y < 0 || head.y >= rows;
        };
        this.collidesWithSelf = function() {
            const head = this.body[0];
            for (let i = 1; i < this.body.length; i++) {
                if (head.x === this.body[i].x && head.y === this.body[i].y) {
                    return true;
                }
            }
            return false;
        };
        this.eatFruit = function(fruit) {
            const head = this.body[0];
            return head.x === fruit.x && head.y === fruit.y;
        };
        this.draw = function() {
            ctx.fillStyle = "green";
            for (let i = 0; i < this.body.length; i++) {
                ctx.fillRect(this.body[i].x * scale, this.body[i].y * scale, scale, scale);
            }
        };
    }

    // Fruit Constructor
    function Fruit() {
        this.x = Math.floor(Math.random() * columns);
        this.y = Math.floor(Math.random() * rows);
        this.draw = function() {
            ctx.fillStyle = "red";
            ctx.fillRect(this.x * scale, this.y * scale, scale, scale);
        };
        this.randomize = function() {
            this.x = Math.floor(Math.random() * columns);
            this.y = Math.floor(Math.random() * rows);
        };
    }

    // Initialize Game
    function init() {
        snake = new Snake();
        fruit = new Fruit();
        direction = "right";
        score = 0;
        gameOver = false;
        document.getElementById("gameOver").style.display = "none";
        updateScore();
        gameLoop();
    }

    // Update Score
    function updateScore() {
        document.getElementById("score").textContent = "Score: " + score;
    }

    // Game Loop
    function gameLoop() {
        if (gameOver) return;

        gameInterval = setTimeout(function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            snake.update();
            if (snake.collidesWithWall() || snake.collidesWithSelf()) {
                gameOver = true;
                document.getElementById("gameOver").style.display = "block";
                return;
            }

            if (snake.eatFruit(fruit)) {
                score++;
                snake.length++;
                fruit.randomize();
                updateScore();
            }

            snake.draw();
            fruit.draw();
            gameLoop();
        }, 150); // Slowed down speed (increased delay)
    }

    // Key Event Listener
    document.addEventListener("keydown", function(event) {
        if (event.key === "ArrowUp") {
            snake.changeDirection("up");
        } else if (event.key === "ArrowDown") {
            snake.changeDirection("down");
        } else if (event.key === "ArrowLeft") {
            snake.changeDirection("left");
        } else if (event.key === "ArrowRight") {
            snake.changeDirection("right");
        }
    });

    // Start Button Event
    document.getElementById("startBtn").addEventListener("click", function() {
        init();
        document.getElementById("startBtn").style.display = "none"; // Hide start button after clicking
    });
</script>
</body>
</html>
